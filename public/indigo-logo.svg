<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 310" width="100%" height="100%">
  <defs>
    <linearGradient id="copperGradMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b85d38" />
      <stop offset="35%" stop-color="#e79c73" />
      <stop offset="55%" stop-color="#f3b692" />
      <stop offset="80%" stop-color="#c96b43" />
      <stop offset="100%" stop-color="#9e4424" />
    </linearGradient>
    <linearGradient id="copperGradRibbon" x1="0%" y1="15%" x2="95%" y2="85%">
      <stop offset="0%" stop-color="#c56740" />
      <stop offset="45%" stop-color="#f1af88" />
      <stop offset="75%" stop-color="#d4784e" />
      <stop offset="100%" stop-color="#a64b2a" />
    </linearGradient>
  </defs>

  <!-- Outer Copper Loop & Left Loop -->
  <path
    d="M 192 52
       C 275 22, 415 40, 415 112
       C 415 162, 355 190, 312 182
       M 248 148
       C 228 190, 140 192, 140 122
       C 140 82, 175 60, 210 56"
    fill="none"
    stroke="url(#copperGradMain)"
    stroke-width="12"
    stroke-linecap="round"
  />

  <!-- Top-Left Wing Tip -->
  <path
    d="M 145 45 L 212 45 C 222 58, 232 65, 250 67 L 166 67 Z"
    fill="url(#copperGradMain)"
  />

  <!-- Central Flowing Copper Ribbon -->
  <path
    d="M 192 74
       L 254 74
       C 278 74, 294 96, 318 140
       C 336 172, 352 178, 375 166
       C 352 192, 312 198, 286 178
       C 262 160, 246 112, 222 86
       C 212 78, 202 74, 192 74 Z"
    fill="url(#copperGradRibbon)"
  />

  <!-- INDIGO Wordmark -->
  <text
    x="260"
    y="246"
    text-anchor="middle"
    fill="#2b2927"
    font-family="'Montserrat', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-size="68"
    font-weight="700"
    letter-spacing="4"
  >INDIGO</text>

  <!-- Subtitle: Mercure Metals & Alloys Pvt. Ltd. (MTC Group removed) -->
  <text
    x="260"
    y="286"
    text-anchor="middle"
    fill="#2b2927"
    font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-size="23.5"
    font-weight="700"
    letter-spacing="0.4"
  >Mercure Metals &amp; Alloys Pvt. Ltd.</text>
</svg>